<VirtualHost *:80>
   ServerName jackett.petselmetsel.nl
   ErrorDocument 404 /404.html

   #HTTP proxy
   ProxyPass / http://localhost:9117/
   ProxyPassReverse / http://localhost:9117/

   #Websocket proxy
   SSLProxyEngine on
   <Location /:/websockets/notifications>
        ProxyPass wss://localhost:9117/:/websockets/notifications
        ProxyPassReverse wss://localhost:9117/:/websockets/notifications
   </Location>

   Header always unset X-Frame-Options
RewriteEngine on
RewriteCond %{SERVER_NAME} =jackett.petselmetsel.nl
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
