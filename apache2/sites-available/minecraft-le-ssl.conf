<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName minecraft.petselmetsel.nl
  DocumentRoot /var/www/petselmetsel
  ErrorLog ${APACHE_LOG_DIR}/petselmetsel/error.log
  CustomLog ${APACHE_LOG_DIR}/petselmetsel/access.log combined
RewriteEngine on
# Some rewrite rules in this file were disabled on your HTTPS site,
# because they have the potential to create redirection loops.

# RewriteCond %{SERVER_NAME} =minecraft.petselmetsel.nl
# RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

SSLCertificateFile /etc/letsencrypt/live/minecraft.petselmetsel.nl/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/minecraft.petselmetsel.nl/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
