<IfModule mod_ssl.c>
<VirtualHost *:443>
   ServerName qbittorrent.petselmetsel.nl
   ErrorDocument 404 /404.html

   #HTTP proxy
   ProxyPass / http://localhost:8080/
   ProxyPassReverse / http://localhost:8080/

   #Websocket proxy
   SSLProxyEngine on
   <Location /:/websockets/notifications>
        ProxyPass wss://localhost:8080/:/websockets/notifications
        ProxyPassReverse wss://localhost:8080/:/websockets/notifications
   </Location>

   Header always unset X-Frame-Options

Include /etc/letsencrypt/options-ssl-apache.conf
SSLCertificateFile /etc/letsencrypt/live/qbittorrent.petselmetsel.nl/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/qbittorrent.petselmetsel.nl/privkey.pem
</VirtualHost>
</IfModule>
