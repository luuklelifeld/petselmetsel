<IfModule mod_ssl.c>
<VirtualHost *:443>
   ServerName prowlarr.petselmetsel.nl
   ErrorDocument 404 /404.html

   #HTTP proxy
   ProxyPass / http://localhost:9696/
   ProxyPassReverse / http://localhost:9696/

   #Websocket proxy
   SSLProxyEngine on
   <Location /:/websockets/notifications>
        ProxyPass wss://localhost:9696/:/websockets/notifications
        ProxyPassReverse wss://localhost:9696/:/websockets/notifications
   </Location>

   Header always unset X-Frame-Options
RewriteEngine on
# Some rewrite rules in this file were disabled on your HTTPS site,
# because they have the potential to create redirection loops.

# RewriteCond %{SERVER_NAME} =prowlarr.petselmetsel.nl
# RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

SSLCertificateFile /etc/letsencrypt/live/prowlarr.petselmetsel.nl/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/prowlarr.petselmetsel.nl/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
