<IfModule mod_ssl.c>
<VirtualHost *:443>
      ServerName hardvoorbeckum.nl
      ServerAlias www.hardvoorbeckum.nl

      ProxyPreserveHost On
      ProxyRequests Off

      ProxyPass / http://127.0.0.1:3000/
      ProxyPassReverse / http://127.0.0.1:3000/

      RequestHeader set X-Forwarded-Proto "http"
      RequestHeader set X-Forwarded-Port "80"

      ErrorLog ${APACHE_LOG_DIR}/hardvoorbeckum_error.log
      CustomLog ${APACHE_LOG_DIR}/hardvoorbeckum_access.log combined

      RewriteEngine on
# Some rewrite rules in this file were disabled on your HTTPS site,
# because they have the potential to create redirection loops.

#       RewriteCond %{SERVER_NAME} =hardvoorbeckum.nl [OR]
#       RewriteCond %{SERVER_NAME} =www.hardvoorbeckum.nl
#       RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
  
SSLCertificateFile /etc/letsencrypt/live/hardvoorbeckum.nl/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/hardvoorbeckum.nl/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
