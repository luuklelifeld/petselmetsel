<IfModule mod_ssl.c>
<VirtualHost *:443>
  ServerName petselmetsel.nl
  ServerAlias www.petselmetsel.nl

  DocumentRoot /var/www/main_domain
  ErrorLog ${APACHE_LOG_DIR}/main_domain/error.log
  CustomLog ${APACHE_LOG_DIR}/main_domain/access.log combined

  RewriteEngine on
# Some rewrite rules in this file were disabled on your HTTPS site,
# because they have the potential to create redirection loops.

#   RewriteCond %{SERVER_NAME} =petselmetsel.nl
#   RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

SSLCertificateFile /etc/letsencrypt/live/petselmetsel.nl/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/petselmetsel.nl/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
