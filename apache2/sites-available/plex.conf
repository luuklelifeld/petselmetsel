<VirtualHost *:443>
   ServerName plex.petselmetsel.nl
   ErrorDocument 404 /404.html

   SSLEngine On
   SSLProxyVerify none
   SSLProxyCheckPeerCN off
   SSLProxyCheckPeerName off

   #HTTP proxy
   ProxyPass / http://localhost:32400/
   ProxyPassReverse / http://localhost:32400/

   #Websocket proxy
   SSLProxyEngine on
   <Location /:/websockets/notifications>
        ProxyPass wss://localhost:32400/:/websockets/notifications
        ProxyPassReverse wss://localhost:32400/:/websockets/notifications
   </Location>

            Header always unset X-Frame-Options
RewriteEngine on
RewriteCond %{SERVER_NAME} =plex.petselmetsel.nl
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
   SSLCertificateFile /etc/letsencrypt/live/plex.petselmetsel.nl/fullchain.pem
   SSLCertificateKeyFile /etc/letsencrypt/live/plex.petselmetsel.nl/privkey.pem
   Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
