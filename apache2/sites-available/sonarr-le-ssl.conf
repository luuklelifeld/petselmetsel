<IfModule mod_ssl.c>
<VirtualHost *:443>
   ServerName sonarr.petselmetsel.nl
   ErrorDocument 404 /404.html

   #HTTP proxy
   ProxyPass / http://localhost:8989/
   ProxyPassReverse / http://localhost:8989/

   #Websocket proxy
   SSLProxyEngine on
   <Location /:/websockets/notifications>
        ProxyPass wss://localhost:8989/:/websockets/notifications
        ProxyPassReverse wss://localhost:8989/:/websockets/notifications
   </Location>

   Header always unset X-Frame-Options

SSLCertificateFile /etc/letsencrypt/live/radarr.petselmetsel.nl/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/radarr.petselmetsel.nl/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
