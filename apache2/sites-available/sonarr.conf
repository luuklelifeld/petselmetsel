<VirtualHost *:80>
   ServerName sonarr.petselmetsel.nl
   ErrorDocument 404 /404.html

   #HTTP proxy
   ProxyPass / http://localhost:8989/
   ProxyPassReverse / http://localhost:8989/

   #Websocket proxy
   SSLProxyEngine on
   <Location /:/websockets/notifications>
        ProxyPass wss://localhost:8989/:/websockets/notifications
        ProxyPassReverse wss://localhost:8989/:/websockets/notifications
   </Location>

   Header always unset X-Frame-Options
RewriteEngine on
RewriteCond %{SERVER_NAME} =sonarr.petselmetsel.nl
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
