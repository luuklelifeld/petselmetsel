version: "2.1"
services:
  jellyfin:
    image: jellyfin/jellyfin:12.1
    container_name: jellyfin
    environment:
      PUID: ${PUID_jellyfin}
      PGID: ${PGID}
      TZ: ${TZ}
      JELLYFIN_CONFIG_DIR: /etc/jellyfin
      JELLYFIN_DATA_DIR: /var/lib/jellyfin
      JELLYFIN_CACHE_DIR: /var/cache/jellyfin
      JELLYFIN_LOG_DIR: /var/log/jellyfin
    volumes:
      - ${APPDATA}/jellyfin:/config
      - /mnt/media:/mnt/media
      - ${APPDATA}/jellyfin/data:/var/lib/jellyfin
      - ${APPDATA}/jellyfin/cache:/var/cache/jellyfin
      - ${APPDATA}/jellyfin/log:/var/log/jellyfin
    ports:
      - "8096:8096"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      PUID: ${PUID_qbittorrent}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: "8080"
      TORRENTING_PORT: ${TORRENTING_PORT:-6881}
    volumes:
      - ${APPDATA}/qbittorrent:/config
      - ${MEDIA}:/data
    ports:
      - "8080:8080"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}"
      - "${TORRENTING_PORT:-6881}:${TORRENTING_PORT:-6881}/udp"
    restart: unless-stopped

  sonarr:
    image: ghcr.io/hotio/sonarr
    container_name: sonarr
    environment:
      - PUID=${PUID_sonarr}
      - PGID=${PGID}
      - UMASK=002
    volumes:
      - ${APPDATA}/sonarr:/config
      - ${MEDIA}:/data
    ports:
      - "8989:8989"

  radarr:
    image: ghcr.io/hotio/radarr
    container_name: radarr
    environment:
      - PUID=${PUID_radarr}
      - PGID=${PGID}
      - UMASK=002
    volumes:
      - ${APPDATA}/radarr:/config
      - ${MEDIA}:/data
    ports:
      - "7878:7878"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      PUID: ${PUID_prowlarr}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${APPDATA}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      LOG_LEVEL: info
      TZ: ${TZ}
    ports:
      - "8191:8191"
    restart: unless-stopped
